
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fce8f1">
  <title>I Love You, Nabil ♡</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body class="love-page">

  <div class="background-glow"></div>
  <div id="hearts" aria-hidden="true"></div>

  <header class="love-message">
    <p class="eyebrow">to my favorite person ♡</p>

    <h1>
      I LOVE YOU
      <span>NABIL SAYANG</span>
    </h1>

    <p class="love-subtitle">
      you will always have my heart ୨୧
    </p>
  </header>

  <div class="flower" aria-label="A blooming pink flower">
    <div class="stem"></div>

    <div class="leaf leaf-left"></div>
    <div class="leaf leaf-right"></div>

    <div class="flower-head">
      <div class="petal petal-1"></div>
      <div class="petal petal-2"></div>
      <div class="petal petal-3"></div>
      <div class="petal petal-4"></div>
      <div class="petal petal-5"></div>
      <div class="petal petal-6"></div>
      <div class="petal petal-7"></div>
      <div class="petal petal-8"></div>

      <div class="flower-center">✧</div>
    </div>
  </div>

  <p class="forever-message">
    forever and always, my love ♡
  </p>

  <div class="music-player">
    <audio id="loveSong" src="facetime.mp3" loop preload="auto"></audio>

    <button id="musicButton" class="music-button" type="button">
      ♫ play our song ♡
    </button>

    <p class="song-caption">a little song for my love</p>
  </div>

</body>
</html>
